<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de login e cadastro</title>
</head>

<body>

    <h2>login</h2>
    <form>
        login:
        <br>
        <input type="text" name="login">
        <br><br>
        Senha:
        <br>

        <input type="password" name="senha">
        <br>

        <input type="submit" value="Logar">


    </form>
    <hr>

    <h2>Cadastrar</h2>
    <form>
        Nome:
        <br>
        <input type="text" name="nome">
        <br><br>
        Sexo:
        <br>
        <input type="radio" name="sexo">Masculino
        <br>
        <input type="radio" name="sexo">Feminino
        <br><br>
        Interesses:
        <br>
        <input type="checkbox" name="Interesses">CINEMA
        <br>
        <input type="checkbox" name="Interesses">TEATRO
        <br>
        <input type="checkbox" name="Interesses">LITERATURA
        <br>
        <input type="checkbox" name="Interesses">MUSÍCA
        <br>
        <input type="checkbox" name="Interesses">CULINÁRIA
        <br>
        Estado
        <br>
        <select name="Estado">
            <option value="SP">SP</option>
            <option value="RJ">RJ</option>
            <option value="MG">MG</option>
            <option value="AL">AL</option>
            <option value="BH">BH</option>
            <option value="AC">AC</option>
            <option value="PA">PA</option>
            <option value="RG">RG</option>
            <option value="MA">MA</option>
            <option value="ES">ES</option>


        </select>
        <br><br>

        Observações
        <br>
        <textarea name="" id=""></textarea>
        <br><br>
        <input type="submit" value="cadastrar">

    </form>

</body>

</html>
